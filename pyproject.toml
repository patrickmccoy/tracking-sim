[project]
name = "tracking-sim"
version = "0.1.0"
description = "Sensor and tracking simulation playground: replay ADS-B traffic as ground truth, simulate sensor detections, and compare Stone Soup trackers."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Patrick McCoy" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pymap3d>=3.1",
    # Stone Soup class names change between releases; keep to a tested minor
    # version. The exact version is pinned in uv.lock.
    "stonesoup>=1.9,<1.10",
]

[project.scripts]
tracking-sim = "tracking_sim.cli:main"

[project.optional-dependencies]
# Running and plotting from the notebooks.
notebook = ["jupyterlab>=4.2", "matplotlib>=3.8", "pandas>=2.2", "nbclient>=0.10", "ipykernel>=6.29"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracking_sim"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["notebook: executes a notebook end to end (needs the notebook extra)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Notebooks are for reading: long plotting lines are easier to follow unwrapped.
"notebooks/*" = ["E501", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["stonesoup.*", "pymap3d.*", "pyarrow.*", "scipy.*"]
ignore_missing_imports = true
