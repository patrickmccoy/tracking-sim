# Example planespotter truth source config. Copy it, then fill in your own
# schema: the table and column names here are placeholders, not the real ones.
#
#   cp scenarios/truth/planespotter.example.yaml scenarios/truth/planespotter.yaml
#
# Connect as a dedicated read-only database user. ${VAR} and ${VAR:-default}
# are read from the environment so credentials never live in this file.
url: "mysql+pymysql://${PLANESPOTTER_DB_USER:-tracking_sim_ro}:${PLANESPOTTER_DB_PASSWORD}@${PLANESPOTTER_DB_HOST:-localhost}/${PLANESPOTTER_DB_NAME:-planespotter}"
receiver: home          # records get source_id planespotter:<receiver>

positions:
  name: positions       # position history table
  columns:
    icao24: icao24
    ts: ts
    lat: lat
    lon: lon
    altitude: altitude  # set to null if the table has no altitude
    callsign: null      # set to a column name if positions carry one
    on_ground: null

velocities:             # set the whole block to null if there is no velocity table
  name: velocities
  columns:
    icao24: icao24
    ts: ts
    gs: gs
    track: track
    vrate: vrate

time:
  kind: datetime        # datetime, epoch_s or epoch_ms
  timezone: UTC         # zone of naive DATETIME values

units:
  altitude: ft          # ft or m
  speed: kt             # kt, mps, kmh or mph
  vrate: fpm            # fpm or mps

# Unverified until checked with tracking_sim.truth.compare; see DECISIONS.md.
altitude_reference: unknown   # unknown, baro or geom

poll_interval_s: 5      # live mode: how often to poll
live_delay_s: 10        # live mode: only read rows at least this old
